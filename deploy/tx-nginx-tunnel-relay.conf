# 桥接 caddy 容器 → SSH 隧道口（127.0.0.1:8080）
# caddy 容器在 172.20.x 网络，经网关 172.20.0.1 访问宿主机本 nginx，
# nginx 再转回 127.0.0.1:8080 的 sshd 反向隧道口。
server {
    listen 172.20.0.1:8080;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
