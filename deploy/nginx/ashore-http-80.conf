# Ashore 公网 HTTP 入口（京东云 111.228.13.15）
# 职责：① ACME HTTP-01 验证（webroot）供 IP 证书签发与续期；② 其余请求 301 跳 HTTPS(8443)
# 部署：放入 /etc/nginx/sites-available/ 并软链启用；webroot 与 acme.sh 的 -w 参数一致（acme-webroot）
server {
    listen 80;
    server_name 111.228.13.15;

    # Let's Encrypt HTTP-01 挑战：IP 证书 6 天有效期，续期全程依赖此路径，绝不重定向
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme-webroot;
        default_type "text/plain";
    }

    # 其余 HTTP 一律 301 到 HTTPS 入口（纯 IP 部署无域名可拼，目标含端口写死）
    location / {
        return 301 https://111.228.13.15:8443$request_uri;
    }
}
