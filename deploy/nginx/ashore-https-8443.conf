# Ashore 生产 HTTPS 入口（京东云 111.228.13.15，IP 证书）
# 链路：浏览器 → nginx(8443 TLS 终止) → 前端静态文件直出 + /api 反代 → 127.0.0.1:8080(Java)
# 注意：证书 6 天有效期，依赖 certbot.timer 自动续期 + renewal-hooks reload（见 prod-https-setup.sh）
server {
    listen 8443 ssl;
    server_name 111.228.13.15;

    ssl_certificate     /etc/letsencrypt/live/111.228.13.15/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/111.228.13.15/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:ashore_ssl:10m;
    ssl_session_timeout 1d;

    # 预留上传余量（图片功能），显式声明防默认 1m 截断
    client_max_body_size 10m;

    # 前端静态资源：发布时 scp frontend/dist → /opt/apps/ashore/frontend-dist/
    root  /opt/apps/ashore/frontend-dist;
    index index.html;

    # 带内容指纹的静态资源长缓存（Vite 产物文件名含 hash，可缓存到失效）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 后端 API 反代（同源，前端 fetch 相对路径直达）：
    # X-Forwarded-For 追加 $remote_addr，应用端 RequestIdFilter 取末段即真实客户端 IP
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;   # AI 面试官出题/点评响应较慢，放宽读超时
    }

    # actuator 不配置反代 => 公网不可达；健康检查一律 ssh 本机 curl 127.0.0.1:8080
    # history 路由兜底：非文件路径一律回 index.html，由 vue-router 接管
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
