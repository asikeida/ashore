services:
  mysql:
    image: mysql:8.4
    container_name: ashore-mysql
    environment:
      MYSQL_DATABASE: ${ASHORE_DB_NAME:?Set ASHORE_DB_NAME in .env}
      MYSQL_USER: ${ASHORE_DB_USERNAME:?Set ASHORE_DB_USERNAME in .env}
      MYSQL_PASSWORD: ${ASHORE_DB_PASSWORD:?Set ASHORE_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${ASHORE_DB_ROOT_PASSWORD:?Set ASHORE_DB_ROOT_PASSWORD in .env}
    ports:
      # 3307 避免与 DocWeave 等本机 MySQL 占用冲突，可在 .env 覆盖
      - "127.0.0.1:${ASHORE_DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1
          -u"$${MYSQL_USER}" "$${MYSQL_DATABASE}" -e "SELECT 1" >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7
    container_name: ashore-redis
    ports:
      # 6380 避免与默认 6379 冲突，可在 .env 覆盖
      - "127.0.0.1:${ASHORE_REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  mysql-data:
  redis-data:
