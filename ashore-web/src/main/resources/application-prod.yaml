# 服务器部署使用；不导入开发 .env，真实密码由部署环境注入。
server:
  # 仅监听回环地址：公网流量一律经本机 Nginx（80 跳转 / 8443 TLS）反代进入，
  # 8080 不对公网暴露（最小攻击面；安全组不开 8080，双保险）
  address: 127.0.0.1
spring:
  datasource:
    url: jdbc:mysql://${ASHORE_DB_HOST}:${ASHORE_DB_PORT:3306}/${ASHORE_DB_NAME:ashore_prod}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: ${ASHORE_DB_USERNAME:ashore_prod}
    password: ${ASHORE_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${ASHORE_REDIS_HOST}
      port: ${ASHORE_REDIS_PORT:6379}
      password: ${ASHORE_REDIS_PASSWORD}
  elasticsearch:
    # 显式声明，不依赖框架默认值（此前 Spring Boot 内置默认恰为 localhost:9200 才工作）；
    # 京东云上 Docker ES 监听本机 9200，与 dev 的隧道 9200 同占位符，可经环境变量覆盖
    uris: ${ASHORE_SEARCH_URL:http://127.0.0.1:9200}
management:
  endpoint:
    health:
      show-details: never
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
