spring:
  application:
    name: ashore
  datasource:
    hikari:
      # 显式声明连接池参数（Hikari 为 Spring Boot 默认池，随 starter 传递引入）。
      # pool-name 用于在启动日志中确认本配置已生效（应看到 "ashore-db - Starting..."）。
      pool-name: ashore-db
      maximum-pool-size: 10        # 默认值；单机开发足够，上线按并发与 DB max_connections 评估
      connection-timeout: 30000    # 获取连接最长等待 30s，超时抛异常而非无限阻塞
      max-lifetime: 1800000        # 连接最长存活 30min，需小于 MySQL wait_timeout 防止使用已失效连接
      leak-detection-threshold: 60000  # 连接借出超 60s 未归还打印告警日志（开发期排查连接泄漏）

server:
  port: 8080

ashore:
  session:
    # JWT 签名密钥：必须通过 ASHORE_JWT_SECRET 环境变量注入。
    # 刻意无默认值——漏配即启动失败（fail-fast），禁止生产静默使用仓库内已知密钥。
    jwt-secret: ${ASHORE_JWT_SECRET}
    # 会话有效期（天），同时是 JWT 过期与 Redis TTL
    expire-days: 30
  search:
    # ES 主路径开关：false 或 ES 故障时自动降级 MySQL LIKE（M5）
    enabled: ${ASHORE_SEARCH_ENABLED:true}
    url: ${ASHORE_SEARCH_URL:http://127.0.0.1:9200}
  ai:
    # 每用户每日 AI 调用上限（成本闸门）
    daily-limit: 20
    # 供应商列表按顺序降级；apiKey 为空 = 未启用（OpenAI 兼容协议）
    providers:
      - name: deepseek
        base-url: https://api.deepseek.com
        api-key: ${AI_DEEPSEEK_API_KEY:}
        model: deepseek-chat
      - name: zhipu
        base-url: https://open.bigmodel.cn/api/paas/v4
        api-key: ${AI_ZHIPU_API_KEY:}
        model: glm-4-flash
  oauth:
    github:
      # 为空表示未启用（端点返回 503001）；启用：注册 GitHub OAuth App 并注入环境变量
      client-id: ${GITHUB_OAUTH_CLIENT_ID:}
      client-secret: ${GITHUB_OAUTH_CLIENT_SECRET:}
      redirect-uri: ${GITHUB_OAUTH_REDIRECT_URI:http://127.0.0.1:8080/api/v1/auth/oauth/github/callback}

logging:
  pattern:
    # [%X{requestId}] 为 MDC 插槽：RequestIDFilter 写入后，本轮所有日志行自动携带同一请求标识
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId}] [%thread] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # 开发期展示 db/redis 组件明细，便于确认本地/隧道环境连通（上生产前改为 never）
      show-details: always