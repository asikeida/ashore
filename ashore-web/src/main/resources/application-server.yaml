# 云端开发 profile：连接京东云（mine-asikeida）共享 MySQL 的 ashore_dev 库与共享 Redis。
# 前置条件：
# 1. MySQL/Redis 由 /opt/projects-infra/{mysql,redis} compose 管理（端口仅绑服务器 127.0.0.1，公网不可达）
# 2. 本地已建立 SSH 隧道：./scripts/dev-tunnel.sh（本地 13306 -> 3306；16379 -> 6379）
# 3. 密码经环境变量注入（ASHORE_DB_PASSWORD / ASHORE_REDIS_PASSWORD），不设默认值
ashore:
  session:
    jwt-secret: dev-cloud-secret-change-me

spring:
  datasource:
    url: ${ASHORE_DB_URL:jdbc:mysql://127.0.0.1:13306/ashore_dev?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${ASHORE_DB_USERNAME:ashore_dev}
    password: ${ASHORE_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: 127.0.0.1
      port: 16379
      password: ${ASHORE_REDIS_PASSWORD:}
