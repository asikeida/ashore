# 云端开发 profile：连接京东云（mine-asikeida）共享 MySQL 的 ashore_dev 库。
# 前置条件：
# 1. MySQL 由 /opt/projects-infra/mysql compose 管理（3306 仅绑服务器 127.0.0.1，公网不可达）
# 2. 本地已建立 SSH 隧道：./scripts/dev-tunnel.sh（本地 13306 -> 京东云 3306）
# 3. 密码经环境变量 ASHORE_DB_PASSWORD 注入（与服务器 secrets/ashore_dev.env 的 DB_PASSWORD 一致），不设默认值
# 4. Redis：京东云暂未部署 Redis 容器，会话/计数等 Redis 功能待共享 Redis 就绪后接入（见 06 计划 M4 收尾说明）
ashore:
  session:
    jwt-secret: dev-cloud-secret-change-me

spring:
  datasource:
    url: ${ASHORE_DB_URL:jdbc:mysql://127.0.0.1:13306/ashore_dev?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${ASHORE_DB_USERNAME:ashore_dev}
    password: ${ASHORE_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
