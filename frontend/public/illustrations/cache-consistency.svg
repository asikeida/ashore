<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420"><rect width="960" height="420" rx="24" fill="#f8f4ef"/><text x="48" y="74" fill="#27344d" font-size="30" font-family="Arial,sans-serif" font-weight="700">缓存一致性：先更新数据库，再失效缓存</text><g font-family="Arial,sans-serif" font-size="23" text-anchor="middle"><rect x="45" y="150" width="180" height="96" rx="14" fill="#27344d"/><text x="135" y="208" fill="white">写请求</text><rect x="300" y="150" width="180" height="96" rx="14" fill="#c85f3b"/><text x="390" y="208" fill="white">更新 MySQL</text><rect x="555" y="150" width="180" height="96" rx="14" fill="#e69b70"/><text x="645" y="208" fill="#27344d">删除缓存</text><text x="260" y="208" fill="#c85f3b">→</text><text x="515" y="208" fill="#c85f3b">→</text><text x="390" y="310" fill="#27344d" font-size="18">成功后再删，失败可重试；并发读仍需评估短暂旧值</text></g></svg>
